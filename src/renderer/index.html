<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova IDE</title>
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #1e1e1e;
        color: #fff;
        font-family: 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      
      #title-bar-container {
        flex-shrink: 0;
      }
      
      .app-content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      
      #status-bar-container {
        flex-shrink: 0;
      }

      .file-tree-panel {
        width: 250px;
        min-width: 200px;
        background: #252526;
        border-right: 1px solid #3e3e42;
        display: flex;
        flex-direction: column;
      }

      .file-tree-header {
        padding: 8px 12px;
        background: #2d2d30;
        border-bottom: 1px solid #3e3e42;
        font-size: 12px;
        font-weight: 600;
        color: #cccccc;
      }

      .file-tree-content {
        flex: 1;
        overflow: hidden;
      }

      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #00d4ff, #0099cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .version {
        font-size: 1.2rem;
        color: #888;
        margin-top: 2rem;
      }
    </style>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self'; style-src 'self' 'unsafe-inline';"
    />
  </head>
  <body>
    <div id="title-bar-container"></div>
    <div class="app-content">
      <div class="file-tree-panel">
        <div class="file-tree-header">Explorer</div>
        <div class="file-tree-content" id="file-tree-container"></div>
      </div>
      <div class="main-content">
        <!-- Welcome Screen -->
        <div class="container" id="welcome-screen">
          <img
            src="./assets/miranova_studios.png"
            alt="Miranova Studios"
            style="max-width: 220px; width: 22vw; height: auto"
          />
          <h1 style="margin-top: 1.25rem">Nova</h1>
          <p style="margin: 0.25rem 0 0; opacity: 0.9">Build. Learn. Iterate.</p>
          <div class="version" id="version" style="display: none">Loading version...</div>
          <button id="copy-diagnostics" style="display: none; margin-top: 2rem; padding: 0.5rem 1rem; background: #00d4ff; color: #1e1e1e; border: none; border-radius: 4px; cursor: pointer; font-size: 0.9rem">Copy Diagnostics</button>
        </div>
        <!-- Tab Bar -->
        <div id="tab-bar-container" style="display: none;"></div>
        <!-- Monaco Editor Container -->
        <div id="monaco-editor-container" style="display: none; width: 100%; height: 100%;"></div>
      </div>
    </div>
    <div id="status-bar-container"></div>
    <!-- Load Monaco Editor via AMD loader -->
    <script src="./vs/loader.js"></script>
    <script src="./vs/editor/editor.main.js"></script>
    <!-- Load our app after Monaco is ready -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
