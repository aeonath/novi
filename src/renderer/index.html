<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova IDE</title>
    
    <!-- XTerm.js CSS -->
    <link rel="stylesheet" href="xterm.css">
    
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #1e1e1e;
        color: #fff;
        font-family: 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      
      #title-bar-container {
        flex-shrink: 0;
      }
      
      .app-content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      
      #status-bar-container {
        flex-shrink: 0;
      }

      .file-tree-panel {
        width: 250px;
        min-width: 200px;
        background: #252526; 
        border-right: 1px solid #3e3e42;
        display: flex;
        flex-direction: column;
      }

      

      .file-tree-header {
        padding: 8px 12px;
        background: #2d2d30;
        border-bottom: 1px solid #3e3e42;
        font-size: 12px;
        font-weight: 600;
        color: #cccccc;
      }

      .file-tree-scroll {
        flex: 1;
        overflow: auto;
      }
      
      /* Match Monaco editor scrollbar styling */
      .file-tree-scroll::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }

      .file-tree-scroll::-webkit-scrollbar-thumb {
        background-color: rgba(121, 121, 121, 0.4);
        border-radius: 0;
      }

      .file-tree-scroll::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 100, 100, 0.7);
      }

      .file-tree-scroll::-webkit-scrollbar-track {
        background-color: transparent;
      }

      .file-tree-scroll::-webkit-scrollbar-corner {
        background-color: transparent;
      }

      /* Monaco editor scrollbar styling */
      .monaco-editor .scrollbar.vertical,
      .monaco-editor .scrollbar.horizontal {
        background-color: transparent !important;
      }
      
      .monaco-editor .slider {
        background-color: rgba(121, 121, 121, 0.4) !important;
        border-radius: 0 !important;
      }
      
      .monaco-editor .slider:hover {
        background-color: rgba(100, 100, 100, 0.7) !important;
      }
      
      .monaco-editor .slider:active {
        background-color: rgba(191, 191, 191, 0.4) !important;
      }
      
      /* Monaco editor content spacing fix */
      .monaco-editor .lines-content {
        padding-right: 20px !important;
      }
      
      .monaco-editor .view-lines {
        padding-right: 20px !important;
      }
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #00d4ff, #0099cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .version {
        font-size: 1.2rem;
        color: #888;
        margin-top: 2rem;
      }

      /* Title bar button overrides to maintain theme colors */
      .title-bar-button {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }
      
      .title-bar-button:hover {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }
      
      .title-bar-button:focus {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }
      
      .title-bar-button:active {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }

      /* Override Windows High Contrast Mode */
      @media (forced-colors: active) {
        .title-bar-button {
          forced-color-adjust: none !important;
          color: #cccccc !important;
          -webkit-text-fill-color: #cccccc !important;
        }
        
        .title-bar-button:hover {
          forced-color-adjust: none !important;
          color: #cccccc !important;
          -webkit-text-fill-color: #cccccc !important;
        }
      }
    </style>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:;"
    />
    <!-- Note: unsafe-eval required for Monaco's AMD loader -->
  </head>
  <body>
    <!-- React Root -->
    <div id="root"></div>
    <!-- Load Monaco Editor via AMD loader -->
    <script src="./monaco-loader.js"></script>
    <script src="./vs/loader.js"></script>
    <script src="./monaco-init.js"></script>
    <!-- Load our app -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
