<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nova IDE</title>
    
    <!-- XTerm.js CSS -->
    <link rel="stylesheet" href="xterm.css">
    
    <style>
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        background-color: #1e1e1e;
        color: #fff;
        font-family: 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      
      #title-bar-container {
        flex-shrink: 0;
      }
      
      .app-content {
        flex: 1;
        display: flex;
        overflow: hidden;
      }
      
      #status-bar-container {
        flex-shrink: 0;
      }

      .file-tree-panel {
        width: 250px;
        min-width: 200px;
        background: #252526; 
        border-right: 1px solid #3e3e42;
        display: flex;
        flex-direction: column;
      }

      

      .file-tree-header {
        padding: 8px 12px;
        background: #2d2d30;
        border-bottom: 1px solid #3e3e42;
        font-size: 12px;
        font-weight: 600;
        color: #cccccc;
      }

      .file-tree-scroll {
        flex: 1;
        overflow: auto;
      }
      
      /* Match Monaco editor scrollbar styling */
      .file-tree-scroll::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }

      .file-tree-scroll::-webkit-scrollbar-thumb {
        background-color: rgba(121, 121, 121, 0.4);
        border-radius: 0;
      }

      .file-tree-scroll::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 100, 100, 0.7);
      }

      .file-tree-scroll::-webkit-scrollbar-track {
        background-color: transparent;
      }

      .file-tree-scroll::-webkit-scrollbar-corner {
        background-color: transparent;
      }

      /* Monaco editor scrollbar styling - Match file tree */
      .monaco-scrollable-element > .scrollbar > .slider {
        background: rgba(121, 121, 121, 0.4) !important;
        border-radius: 0 !important;
      }
      
      .monaco-scrollable-element > .scrollbar > .slider:hover {
        background: rgba(100, 100, 100, 0.7) !important;
      }
      
      .monaco-scrollable-element > .scrollbar > .slider:active {
        background: rgba(191, 191, 191, 0.4) !important;
      }
      
      .monaco-scrollable-element > .scrollbar {
        background: transparent !important;
      }
      
      .monaco-scrollable-element .shadow {
        display: none !important;
      }

      /* Terminal (xterm) scrollbar styling - Match file tree and Monaco */
      .xterm .xterm-viewport::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }

      .xterm .xterm-viewport::-webkit-scrollbar-thumb {
        background-color: rgba(121, 121, 121, 0.4);
        border-radius: 0;
      }

      .xterm .xterm-viewport::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 100, 100, 0.7);
      }

      .xterm .xterm-viewport::-webkit-scrollbar-track {
        background-color: transparent;
      }

      .xterm .xterm-viewport::-webkit-scrollbar-corner {
        background-color: transparent;
      }

      /* TabBar horizontal scrollbar styling - Match file tree, Monaco, and terminal */
      .tab-bar-container::-webkit-scrollbar {
        width: 14px;
        height: 14px;
      }

      .tab-bar-container::-webkit-scrollbar-thumb {
        background-color: rgba(121, 121, 121, 0.4);
        border-radius: 0;
      }

      .tab-bar-container::-webkit-scrollbar-thumb:hover {
        background-color: rgba(100, 100, 100, 0.7);
      }

      .tab-bar-container::-webkit-scrollbar-track {
        background-color: transparent;
      }

      .tab-bar-container::-webkit-scrollbar-corner {
        background-color: transparent;
      }
      
      /* Monaco editor content spacing fix */
      .monaco-editor .lines-content {
        padding-right: 20px !important;
      }
      
      .monaco-editor .view-lines {
        padding-right: 20px !important;
      }
      .main-content {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .container {
        flex: 1;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
      }

      h1 {
        font-size: 3rem;
        margin-bottom: 1rem;
        background: linear-gradient(45deg, #00d4ff, #0099cc);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .version {
        font-size: 1.2rem;
        color: #888;
        margin-top: 2rem;
      }

      /* Title bar button overrides to maintain theme colors */
      .title-bar-button {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }
      
      .title-bar-button:hover {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }
      
      .title-bar-button:focus {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }
      
      .title-bar-button:active {
        color: #cccccc !important;
        forced-color-adjust: none !important;
        -webkit-text-fill-color: #cccccc !important;
      }

      /* Override Windows High Contrast Mode */
      @media (forced-colors: active) {
        .title-bar-button {
          forced-color-adjust: none !important;
          color: #cccccc !important;
          -webkit-text-fill-color: #cccccc !important;
        }
        
        .title-bar-button:hover {
          forced-color-adjust: none !important;
          color: #cccccc !important;
          -webkit-text-fill-color: #cccccc !important;
        }
      }
    </style>
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; worker-src 'self' blob:;"
    />
    <meta
      http-equiv="Permissions-Policy"
      content="clipboard-read=*, clipboard-write=*"
    />
    <!-- Note: unsafe-eval required for Monaco's AMD loader -->
  </head>
  <body>
    <!-- React Root -->
    <div id="root"></div>
    
    <!-- Clipboard polyfill for Electron -->
    <script>
      // Override navigator.clipboard to use Electron's clipboard API
      if (window.api && window.api.clipboardReadText && window.api.clipboardWriteText) {
        Object.defineProperty(navigator, 'clipboard', {
          value: {
            readText: async () => {
              return window.api.clipboardReadText();
            },
            writeText: async (text) => {
              window.api.clipboardWriteText(text);
              return Promise.resolve();
            },
            read: async () => {
              // Minimal implementation for compatibility
              const text = window.api.clipboardReadText();
              return Promise.resolve([{
                types: ['text/plain'],
                getType: async (type) => {
                  if (type === 'text/plain') {
                    return new Blob([text], { type: 'text/plain' });
                  }
                  throw new Error('Unsupported type');
                }
              }]);
            },
            write: async (data) => {
              // Minimal implementation for compatibility
              if (data && data.length > 0) {
                const item = data[0];
                if (item && item.types.includes('text/plain')) {
                  const blob = await item.getType('text/plain');
                  const text = await blob.text();
                  window.api.clipboardWriteText(text);
                }
              }
              return Promise.resolve();
            }
          },
          writable: false,
          configurable: false
        });
        console.log('[Clipboard] Polyfill installed using Electron clipboard API');
      }
    </script>
    
    <!-- Load Monaco Editor via AMD loader -->
    <script src="./monaco-loader.js"></script>
    <script src="./vs/loader.js"></script>
    <script src="./monaco-init.js"></script>
    <!-- Load our app -->
    <script type="module" src="./index.js"></script>
  </body>
</html>
